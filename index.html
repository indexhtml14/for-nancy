<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nancy ❤️</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ffeef2 0%, #ffd1dc 100%);
            color: #d63384;
            text-align: center;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        /* Floating background hearts animation */
        .floating-heart {
            position: absolute;
            color: rgba(214, 51, 132, 0.2);
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            z-index: 0;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.8);
                opacity: 0;
            }
            50% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.15);
            transition: background 0.5s ease, color 0.5s ease;
        }

        h1 { font-size: clamp(1.8rem, 7vw, 2.3rem); margin-bottom: 15px; }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
            transition: transform 0.2s, background 0.2s;
            display: block;
            width: 100%;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn:hover { background: #b8226c; transform: scale(1.03); }

        input[type="text"], textarea {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #d63384;
            border-radius: 20px;
            outline: none;
            text-align: center;
            width: 100%;
            max-width: 320px;
            margin: 10px 0;
            background: white;
            color: #333;
            font-family: inherit;
        }

        textarea {
            text-align: left;
            resize: none;
            height: 90px;
            border-radius: 15px;
        }
