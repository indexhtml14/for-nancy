<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nancy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            color: #d63384;
            text-align: center;
            transition: background-color 0.8s ease, transform 0.8s ease;
        }
        .container {
            padding: 20px;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .input-area {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #d63384;
            border-radius: 25px;
            outline: none;
            text-align: center;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
        }
        .social-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .hidden {
            display: none !important;
        }
        /* Final screen backgrounds */
        .match-bg {
            background-color: #ff3366 !important;
            color: white !important;
        }
        .no-match-bg {
            background-color: #6c757d !important;
            color: white !important;
        }
        .match-bg input[type="text"] {
            border-color: white;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Page 1: I Love You Nancy -->
        <div id="page1">
            <h1>I Love You Nancy ❤️</h1>
            <button class="btn" onclick="goToPage2()">Next</button>
        </div>

        <!-- Page 2: The Question -->
        <div id="page2" class="hidden">
            <p>Tell the person's name which you love :</p>
            <div class="input-area">
                <input type="text" id="loverName" placeholder="Type a name here..." autocomplete="off">
                <br>
                <button class="btn" onclick="checkName()">Submit</button>
            </div>
        </div>

        <!-- Page 3: The Result / Match Screen -->
        <div id="page3" class="hidden">
            <h1 id="resultText"></h1>
            
            <div id="matchOptions" class="hidden">
                <p>Optional: Enter your Instagram or Discord ID below:</p>
                <form id="responseForm" action="https://formspree.io" method="POST" onsubmit="submitResults(event)">
                    <input type="hidden" name="Entered Name" id="formEnteredName">
                    <input type="text" name="Contact ID" id="userSocialId" placeholder="e.g. @your_username">
                    <br>
                    <button type="submit" class="btn">Send</button>
                </form>
                <br>
                <p>Or find me on Instagram:</p>
                <a href="https://instagram.com" target="_blank" class="social-link">@dhruv_jaat_14</a>
            </div>

            <div id="thankYouMsg" class="hidden">
                <h2>Sent! ❤️</h2>
            </div>
        </div>
    </div>

    <script>
        const myName = "Dhruv";

        // --- NEW: CHECK IF USER ALREADY FILLED OUT THE FORM ON PAGE LOAD ---
        window.onload = function() {
            const savedName = localStorage.getItem("hasSubmittedName");
            if (savedName) {
                // Instantly lock them to the final result screen based on their saved answer
                showFinalResult(savedName);
            }
        };

        function goToPage2() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        function checkName() {
            const inputName = document.getElementById('loverName').value.trim();
            
            if (inputName === "") {
                alert("Please type a name first!");
                return;
            }

            // --- NEW: SAVE TO BROWSER STORAGE IMMEDIATELY ---
            localStorage.setItem("hasSubmittedName", inputName);

            // Save entered name into hidden form input
            document.getElementById('formEnteredName').value = inputName;

            // Send whatever name she typed IMMEDIATELY to Formspree
            const initialData = new FormData();
            initialData.append('Entered Name', inputName);
            initialData.append('Status', inputName.toLowerCase() === myName.toLowerCase() ? 'Matched (Yes I am Dhruv)' : 'Did Not Match (I am not)');
            
            fetch("https://formspree.io", {
                method: 'POST',
                body: initialData,
                headers: { 'Accept': 'application/json' }
            });

            // Process and display the results
            showFinalResult(inputName);
        }

        // --- NEW: ISOLATED FUNCTION TO RENDER THE FINAL MATCH OR NO-MATCH SCREEN ---
        function showFinalResult(name) {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.add('hidden');
            
            const page3 = document.getElementById('page3');
            const resultText = document.getElementById('resultText');
            const matchOptions = document.getElementById('matchOptions');
            const body = document.body;

            page3.classList.remove('hidden');

            if (name.toLowerCase() === myName.toLowerCase()) {
                body.classList.add('match-bg');
                resultText.innerText = "Yes I am ❤️";
                matchOptions.classList.remove('hidden');
            } else {
                body.classList.add('no-match-bg');
                resultText.innerText = "I am not";
            }
        }

        function submitResults(event) {
            event.preventDefault();
            const form = event.target;
            const data = new FormData(form);
            data.append('Status', 'Provided Social ID');

            fetch(form.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('matchOptions').classList.add('hidden');
                    document.getElementById('thankYouMsg').classList.remove('hidden');
                } else {
                    alert("Something went wrong. Please try again!");
                }
            }).catch(error => {
                alert("Error submitting. Please try again!");
            });
        }
    </script>
</body>
</html>
