
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nancy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            color: #d63384;
            text-align: center;
            transition: background-color 0.8s ease, color 0.8s ease;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 2.8rem);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .input-area {
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #d63384;
            border-radius: 25px;
            outline: none;
            text-align: center;
            width: 100%;
            max-width: 320px;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.15);
        }

        .social-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: white;
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none !important;
        }

        .match-bg {
            background-color: #ff3366;
            color: white;
        }

        .match-bg input[type="text"] {
            border-color: white;
            color: #333;
        }

        .no-match-bg {
            background-color: #6c757d;
            color: white;
        }

        .message {
            font-size: 1rem;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <main class="container">

        <!-- Page 1 -->
        <section id="page1">
            <h1>I Love You Nancy ❤️</h1>
            <button class="btn" type="button" onclick="goToPage2()">
                Next
            </button>
        </section>

        <!-- Page 2 -->
        <section id="page2" class="hidden">
            <p>Tell the person's name you love:</p>

            <div class="input-area">
                <form id="nameForm">
                    <input
                        type="text"
                        id="loverName"
                        placeholder="Type a name here..."
                        autocomplete="off"
                        required
                    >
                    <br>
                    <button class="btn" type="submit">
                        Submit
                    </button>
                </form>
            </div>
        </section>

        <!-- Page 3 -->
        <section id="page3" class="hidden">
            <h1 id="resultText"></h1>

            <div id="matchOptions" class="hidden">
                <p>Optional: Enter your Instagram or Discord ID below:</p>

                <form id="responseForm">
                    <input
                        type="hidden"
                        name="Entered Name"
                        id="formEnteredName"
                    >

                    <input
                        type="text"
                        name="Contact ID"
                        id="userSocialId"
                        placeholder="e.g. @your_username"
                        autocomplete="off"
                    >

                    <br>

                    <button class="btn" type="submit">
                        Send
                    </button>

                    <p id="formMessage" class="message" role="status"></p>
                </form>

                <br>

                <p>Or find me on Instagram:</p>

                <a
                    href="https://instagram.com/dhruv_jaat_14"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-link"
                >
                    @dhruv_jaat_14
                </a>
            </div>

            <div id="thankYouMsg" class="hidden">
                <h2>Sent! ❤️</h2>
                <p>Thank you!</p>
            </div>
        </section>

    </main>

    <script>
        // Your name
        const myName = "Dhruv";

        // Your Formspree endpoint
        const formspreeURL = "https://formspree.io/f/xyekwabj";

        function goToPage2() {
            document.getElementById("page1").classList.add("hidden");
            document.getElementById("page2").classList.remove("hidden");

            document.getElementById("loverName").focus();
        }

        // Handle the name form
        document.getElementById("nameForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();
                await checkName();
            }
        );

        async function checkName() {
            const inputName = document
                .getElementById("loverName")
                .value.trim();

            if (!inputName) {
                alert("Please type a name first!");
                return;
            }

            const page2 = document.getElementById("page2");
            const page3 = document.getElementById("page3");
            const resultText = document.getElementById("resultText");
            const matchOptions = document.getElementById("matchOptions");
            const body = document.body;

            document.getElementById("formEnteredName").value = inputName;

            page2.classList.add("hidden");
            page3.classList.remove("hidden");

            body.classList.remove("match-bg", "no-match-bg");

            if (inputName.toLowerCase() === myName.toLowerCase()) {
                body.classList.add("match-bg");
                resultText.textContent = "Yes I am ❤️";
                matchOptions.classList.remove("hidden");
            } else {
                body.classList.add("no-match-bg");
                resultText.textContent = "I am not";
                matchOptions.classList.add("hidden");
            }

            // Send the name to Formspree in the background.
            // The result screen does not depend on this request.
            const initialData = new FormData();

            initialData.append("Entered Name", inputName);
            initialData.append(
                "Status",
                inputName.toLowerCase() === myName.toLowerCase()
                    ? "Matched (Yes I am)"
                    : "Did Not Match (I am not)"
            );

            try {
                const response = await fetch(formspreeURL, {
                    method: "POST",
                    body: initialData,
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    console.error(
                        "Name submission failed:",
                        response.status,
                        await response.text()
                    );
                }
            } catch (error) {
                console.error("Name submission network error:", error);
            }
        }

        // Handle Instagram / Discord ID submission
        document.getElementById("responseForm").addEventListener(
            "submit",
            submitResults
        );

        async function submitResults(event) {
            event.preventDefault();

            const form = event.currentTarget;
            const sendButton = form.querySelector(
                'button[type="submit"]'
            );
            const message = document.getElementById("formMessage");

            const contactID = document
                .getElementById("userSocialId")
                .value.trim();

            if (!contactID) {
                message.textContent = "Please enter your ID first.";
                return;
            }

            const data = new FormData(form);
            data.append("Status", "Provided Social ID");

            sendButton.disabled = true;
            sendButton.textContent = "Sending...";
            message.textContent = "";

            try {
                const response = await fetch(formspreeURL, {
                    method: "POST",
                    body: data,
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (response.ok) {
                    document.getElementById("matchOptions")
                        .classList.add("hidden");

                    document.getElementById("thankYouMsg")
                        .classList.remove("hidden");
                } else {
                    let errorMessage =
                        "Submission failed. Please try again.";

                    try {
                        const result = await response.json();

                        if (result.errors && result.errors.length) {
                            errorMessage = result.errors
                                .map(error => error.message)
                                .join(" ");
                        } else if (response.status === 429) {
                            errorMessage =
                                "Too many submissions. Please try later.";
                        } else if (response.status >= 500) {
                            errorMessage =
                                "Formspree is temporarily unavailable.";
                        }
                    } catch (_) {
                        // Keep the default error message.
                    }

                    message.textContent = errorMessage;
                    sendButton.disabled = false;
                    sendButton.textContent = "Send";

                    console.error(
                        "Formspree response:",
                        response.status
                    );
                }
            } catch (error) {
                console.error("Form submission error:", error);

                message.textContent =
                    "Network error. Check your connection and try again.";

                sendButton.disabled = false;
                sendButton.textContent = "Send";
            }
        }
    </script>
</body>
</html>
